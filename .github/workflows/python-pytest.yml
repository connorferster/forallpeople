# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        python -m uv pip install .
        python -m uv pip install pytest black
    - name: Test black formatted
      run: |
        black forallpeople --check
    - name: Test with pytest
      run: |
        pytest

  ymprint-plugin:
    # The YMPrint plugin's tests skip without ymprint, which needs Python 3.14.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Install forallpeople and ymprint
      run: |
        python -m pip install --upgrade pip
        python -m pip install . "ymprint>=0.8.1" pytest
    - name: Test the YMPrint plugin
      run: |
        pytest forallpeople/tests/test_ymprint_plugin.py -v
