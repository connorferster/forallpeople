name: Build docs and publish to Bunny.net

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
    - name: Build docs
      # The 'docs' dependency group is Sphinx, its extensions, and what the
      # guide pages run: their code cells are executed on every build, so a
      # broken example fails it. uv.lock is not committed, so the dependencies
      # are resolved fresh. Python is pinned because, with no requires-python,
      # uv would choose the newest Python, which the Jupyter kernel's compiled
      # dependencies may not have wheels for yet.
      # -d keeps Sphinx's build cache (doctrees) out of the deployed folder.
      run: |
        uv run --python 3.13 --no-default-groups --group docs sphinx-build -W -b html -d docs/_build/doctrees docs docs/_build/html
    - name: Deploy to BunnyCDN
      # Pull requests only build the docs; a push to main deploys them.
      if: github.event_name == 'push'
      uses: ayeressian/bunnycdn-storage-deploy@v2.3.0 #
      with:
          source: "./docs/_build/html"
          destination: "."
          storageZoneName: "${{ secrets.STORAGE_NAME }}"
          storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
          storageEndpoint: "storage.bunnycdn.com"  # the storage zone's main region is Falkenstein (DE)
          accessKey: "${{ secrets.STORAGE_KEY }}"
          pullZoneId: "${{ secrets.ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "5"